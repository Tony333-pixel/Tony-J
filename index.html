<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Improve Ourselves</title>
<style>
:root{--bg:#f4f6fb;--cd:#fff;--tx:#1d2433;--mu:#6b7385;--pr:#5b5bd6;--pl:#ececff;--ok:#16a34a;--bd:#e3e7f0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#10131c;--cd:#1a1f2d;--tx:#eef0f6;--mu:#9aa3b8;--pl:#2a2d55;--bd:#2b3246}}
:root[data-theme=dark]{--bg:#10131c;--cd:#1a1f2d;--tx:#eef0f6;--mu:#9aa3b8;--pl:#2a2d55;--bd:#2b3246}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:84px}
main{max-width:860px;margin:auto;padding:16px}h1,h2,h3{margin:0 0 8px}h1{font-size:1.5rem}h2{font-size:1.15rem}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:18px;padding:16px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}.grid .card{margin:0}
.big{font-size:1.8rem;font-weight:700;color:var(--pr)}.mu{color:var(--mu);font-size:.9rem}
button,.btn{background:var(--pr);color:#fff;border:0;border-radius:999px;padding:11px 20px;font:inherit;font-weight:600;cursor:pointer}
button.sec{background:var(--pl);color:var(--pr)}button:disabled{opacity:.5;cursor:default}
input[type=number],textarea,input[type=text]{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit}
.bar{height:10px;background:var(--pl);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pr);border-radius:9px;transition:width .3s}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--cd);border-top:1px solid var(--bd);display:flex;justify-content:center;gap:4px;padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px))}
nav button{background:none;color:var(--mu);padding:8px 10px;font-size:.78rem;flex:1;max-width:130px;border-radius:14px}nav button.on{background:var(--pl);color:var(--pr)}
.opt{display:block;width:100%;text-align:left;background:var(--bg);color:var(--tx);border:2px solid var(--bd);border-radius:14px;margin:8px 0;padding:12px 14px;font-weight:500}.opt.on{border-color:var(--pr);background:var(--pl)}
.row{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd);font-size:.92rem}.row:last-child{border:0}
.chk{display:flex;gap:10px;align-items:center;padding:8px 0}.chk input{width:22px;height:22px;accent-color:var(--pr)}
.msg{background:var(--pl);color:var(--pr);border-radius:14px;padding:12px 14px;font-weight:500}
.av{width:84px;height:84px;border-radius:50%;background:var(--pl);color:var(--pr);display:flex;align-items:center;justify-content:center;font-size:2rem;font-weight:700;object-fit:cover}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.center{text-align:center;padding:60px 16px}svg text{fill:var(--mu);font-size:11px}
</style></head><body><main id="app"><div class="center mu">Loading…</div></main><nav id="nav" hidden></nav>
<script>
const Q=[ // [question, options, answerIndex] — 3 rotating sets of 8
["What is the capital of Australia?",["Sydney","Canberra","Melbourne","Perth"],1],["Which planet is closest to the Sun?",["Venus","Earth","Mercury","Mars"],2],["What does CPU stand for?",["Central Processing Unit","Computer Personal Unit","Core Power Utility","Central Program Utility"],0],["What is 15 × 6?",["80","85","90","96"],2],["Choose the correct sentence.",["She don't like tea.","She doesn't like tea.","She not like tea.","She doesn't likes tea."],1],["Which habit best improves sleep quality?",["Phone in bed","Fixed bedtime","Late caffeine","Skipping dinner"],1],["What gas do plants absorb for photosynthesis?",["Oxygen","Nitrogen","Carbon dioxide","Helium"],2],["Which is a programming language?",["HTTP","Python","HTML5 file","USB"],1],
["How many continents are there?",["5","6","7","8"],2],["What is H₂O commonly known as?",["Salt","Water","Hydrogen","Acid"],1],["What does RAM do?",["Stores files permanently","Holds data being used now","Cools the PC","Connects to Wi-Fi"],1],["What is the square root of 144?",["10","11","12","14"],2],["Which word is a synonym of “happy”?",["Sad","Joyful","Angry","Tired"],1],["What should you do first if you smell smoke at home?",["Hide","Alert others and leave safely","Open all windows and wait","Take a nap"],1],["What force pulls objects toward Earth?",["Magnetism","Friction","Gravity","Inertia"],2],["What does “www” stand for?",["World Wide Web","Wide Web World","Web With Wires","World Web Window"],0],
["Who wrote “Romeo and Juliet”?",["Dickens","Shakespeare","Twain","Orwell"],1],["How many minutes are in 2.5 hours?",["120","140","150","160"],2],["Which is the largest ocean?",["Atlantic","Indian","Arctic","Pacific"],3],["In binary, what is 101?",["3","4","5","6"],2],["Which is a noun?",["Quickly","Beautiful","Library","Run"],2],["Saving a little money regularly is called…",["Spending","Budgeting/saving","Borrowing","Gambling"],1],["What is the chemical symbol for gold?",["Go","Gd","Au","Ag"],2],["What is a strong password?",["12345678","Your name","Long mix of words, numbers, symbols","password"],2]];
const MSG=["Small steps count. Today, pick one thing that makes future-you smile.","Balance is a skill — and you’re building it, one day at a time.","Gaming can be fun. Choosing when to stop is a superpower.","Progress beats perfection. Even 10 minutes of something new helps.","You’re in control of your time. Spend some of it on something you’ll be proud of.","Rest, move, learn, connect — a good day has a bit of each.","Every week you learn a little more. That adds up fast!"];
const TIPS=["Decide your gaming time before you start, and set a timer.","Play after your study/chores, not before.","Pause between matches: stretch, drink water, look away from the screen.","Keep devices out of the bedroom at night.","Replace one session a week with a friend, a walk, or a hobby.","Cut down gradually — 10 minutes less each week is real progress."];
const ACT=["📚 Study or read 30 minutes","🏃 Exercise or walk","🎨 Hobby: draw, music, build, cook","👨‍👩‍👧 Time with family or friends","🎮 Kept gaming within my plan"];
const SETS=8,$=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const p2=n=>String(n).padStart(2,"0"),dk=d=>d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate());
const wkOf=d=>{const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())),n=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-n);const y=t.getUTCFullYear();const w=Math.ceil(((t-Date.UTC(y,0,1))/864e5+1)/7);return{k:y+"-W"+p2(w),w,y}};
const fmt=i=>i?new Date(i).toLocaleString([],{dateStyle:"medium",timeStyle:"short"}):"—",fd=i=>new Date(i).toLocaleDateString([],{dateStyle:"medium"});
let S,ref,tab="home",T=null,me={};
const NOW=()=>new Date(),cur=()=>wkOf(NOW());
const setFor=w=>Q.slice((w%3)*SETS,(w%3)*SETS+SETS);
const sc=()=>Object.entries(S.tests||{}).sort((a,b)=>a[0]<b[0]?-1:1);
const goalDays=()=>Object.values(S.gaming||{}).filter(g=>g.goals&&g.goals.filter(Boolean).length>=4).length;
const pts=()=>sc().reduce((a,[,t])=>a+t.s*10,0)+goalDays()*20;
const streak=()=>{let n=0,i=S.tests?.[cur().k]?0:1;while(S.tests?.[wkOf(new Date(Date.now()-7*864e5*i)).k]){n++;i++}return n};
async function save(){try{await ref.set(S)}catch(e){console.error(e)}}
async function init(){
 const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
 if(!db||!user){$("#app").innerHTML='<div class="center"><h1>Improve Ourselves</h1><p class="mu">Please open this page signed in to Claude to use your private account.</p></div>';return}
 me=await user.me();ref=db.collection("data/users/"+await user.id()).doc("state");
 let s;try{s=await ref.get()}catch(e){s=null}
 S=s&&s.exists?{...s.data()}:{created:Date.now(),tests:{},gaming:{},logins:[]};
 S.name=S.name||me.name||"Friend";S.logins=[...(S.logins||[])];S.tests=S.tests||{};S.gaming=S.gaming||{};
 if(S.theme)document.documentElement.dataset.theme=S.theme;
 let on=false;try{on=sessionStorage.getItem("io")==="1"}catch(e){}
 if(!on||!S.logins.length||S.logins.at(-1).out)login();else render();
}
function login(){S.logins.push({in:Date.now(),out:null});S.logins=S.logins.slice(-30);try{sessionStorage.setItem("io","1")}catch(e){}save();render()}
function logout(){const l=S.logins.at(-1);if(l&&!l.out)l.out=Date.now();try{sessionStorage.removeItem("io")}catch(e){}save();tab="out";render()}
function go(t){tab=t;T=null;render();scrollTo(0,0)}
function render(){
 const nav=$("#nav");if(tab==="out"){nav.hidden=true;$("#app").innerHTML='<div class="center"><h1>👋 See you soon!</h1><p class="mu">You were signed out at '+fmt(S.logins.at(-1)?.out)+'. Your progress is saved.</p><button onclick="login()">Sign back in</button></div>';return}
 nav.hidden=false;const N=[["home","🏠","Home"],["test","📝","Weekly Test"],["prog","📈","Progress"],["game","🎮","Control Gaming"],["me","👤","Profile"]];
 nav.innerHTML=N.map(n=>`<button class="${tab===n[0]?"on":""}" onclick="go('${n[0]}')">${n[1]}<br>${n[2]}</button>`).join("");
 $("#app").innerHTML={home,test,prog,game,me:prof}[tab]();
}
function stats(){const e=sc(),v=e.map(x=>x[1].s),tot=e.map(x=>x[1].t);
 return{n:e.length,hi:v.length?Math.max(...v):0,avg:v.length?(v.reduce((a,b)=>a+b,0)/v.length).toFixed(1):0,imp:v.length>1?v.at(-1)-v.at(-2):0,e}}
function home(){const c=cur(),t=S.tests[c.k],st=stats(),prev=st.e.filter(x=>x[0]!==c.k).slice(-4).reverse(),L=S.logins;
 return `<div class="top"><div><h1>Hi, ${esc(S.name)} 👋</h1><div class="mu">Week ${c.w} · ${esc(MSG[NOW().getDay()])}</div></div></div>
 <div class="grid"><div class="card"><div class="mu">This week</div><div class="big">${t?t.s+"/"+t.t:"—"}</div></div><div class="card"><div class="mu">Total points</div><div class="big">${pts()}</div></div><div class="card"><div class="mu">Tests done</div><div class="big">${st.n}</div></div><div class="card"><div class="mu">Streak 🔥</div><div class="big">${streak()} wk</div></div></div>
 <div class="card"><h2>Weekly test</h2>${t?`<p>✅ Completed — you scored <b>${t.s}/${t.t}</b>. Next test opens Monday.</p><button class="sec" onclick="go('prog')">See progress</button>`:`<p class="mu">This week’s ${SETS}-question test is ready.</p><button onclick="go('test')">Start this week’s test</button>`}</div>
 <div class="card"><h2>Previous weeks</h2>${prev.map(([k,x])=>`<div class="row"><span>${k.replace("-W"," · Week ")} <span class="mu">(${fd(x.d)})</span></span><b>${x.s}/${x.t}</b></div>`).join("")||'<div class="mu">Your past scores will appear here.</div>'}</div>
 <div class="card"><h2>Login history</h2><div class="row"><span>Latest login</span><b>${fmt(L.at(-1)?.in)}</b></div><div class="row"><span>Latest logout</span><b>${fmt([...L].reverse().find(l=>l.out)?.out)}</b></div>
 ${L.slice(-6,-1).reverse().map(l=>`<div class="row mu"><span>In ${fmt(l.in)}</span><span>Out ${fmt(l.out)}</span></div>`).join("")}
 <button class="sec" style="margin-top:10px" onclick="logout()">Log out</button></div>`}
function test(){const c=cur(),t=S.tests[c.k],qs=setFor(c.w);
 if(t&&!(T&&T.done))return `<div class="card center"><h1>✅ Week ${c.w} complete</h1><div class="big">${t.s}/${t.t}</div><p class="mu">Completed ${fd(t.d)}. One official test per week — a new one unlocks next Monday.</p><button onclick="go('prog')">View progress</button></div>`;
 if(!T)return `<div class="card center"><h1>📝 Week ${c.w} Test</h1><p class="mu">${qs.length} multiple-choice questions · general knowledge, computer science, science, maths, English & life skills. You can take the official test once this week.</p><button onclick="T={i:0,a:[]};render()">Start</button></div>`;
 if(T.done)return `<div class="card center"><h1>${T.s>=qs.length*.8?"🎉 Great work!":"👏 Nice effort!"}</h1><div class="big">${T.s}/${qs.length}</div><p>+${T.s*10} points earned. Score saved to your Progress.</p><button onclick="go('home')">Back to Home</button></div>`;
 const q=qs[T.i];return `<div class="card"><div class="mu">Question ${T.i+1} of ${qs.length}</div><div class="bar"><i style="width:${T.i/qs.length*100}%"></i></div><h2 style="margin-top:14px">${esc(q[0])}</h2>${q[1].map((o,j)=>`<button class="opt ${T.a[T.i]===j?"on":""}" onclick="T.a[T.i]=${j};render()">${esc(o)}</button>`).join("")}
 <button ${T.a[T.i]==null?"disabled":""} onclick="nextQ()">${T.i===qs.length-1?"Submit test":"Next →"}</button></div>`}
async function nextQ(){const c=cur(),qs=setFor(c.w);if(T.i<qs.length-1){T.i++;return render()}
 const s=qs.reduce((a,q,i)=>a+(T.a[i]===q[2]?1:0),0);S.tests[c.k]={s,t:qs.length,d:Date.now(),a:T.a};T={done:true,s};await save();render()}
function prog(){const st=stats(),e=st.e.slice(-8),c=cur().k;
 const bars=e.map(([k,x],i)=>{const h=x.s/x.t*120,xx=20+i*56;return `<rect x="${xx}" y="${140-h}" width="36" height="${h}" rx="8" fill="var(--pr)"/><text x="${xx+18}" y="${134-h}" text-anchor="middle">${x.s}/${x.t}</text><text x="${xx+18}" y="156" text-anchor="middle">W${+k.slice(6)}</text>`}).join("");
 return `<h1>Progress</h1><div class="grid"><div class="card"><div class="mu">This week</div><div class="big">${S.tests[c]?S.tests[c].s+"/"+S.tests[c].t:"—"}</div></div><div class="card"><div class="mu">Highest</div><div class="big">${st.hi}</div></div><div class="card"><div class="mu">Average</div><div class="big">${st.avg}</div></div><div class="card"><div class="mu">Completed</div><div class="big">${st.n}</div></div><div class="card"><div class="mu">Weekly change</div><div class="big">${st.imp>0?"+":""}${st.imp}</div></div></div>
 <div class="card"><h2>Score chart</h2>${e.length?`<div style="overflow-x:auto"><svg viewBox="0 0 ${Math.max(340,e.length*56+30)} 165" width="${Math.max(340,e.length*56+30)}" style="max-width:100%">${bars}</svg></div>`:'<div class="mu">Complete your first test to see your chart.</div>'}</div>
 <div class="card"><h2>All tests</h2>${[...st.e].reverse().map(([k,x])=>`<div class="row"><span>${k.replace("-W"," · Week ")} <span class="mu">${fd(x.d)}</span></span><b>${x.s}/${x.t}</b></div>`).join("")||'<div class="mu">No tests yet.</div>'}</div>`}
function game(){const d=dk(NOW()),g=S.gaming[d]||{min:"",goals:[0,0,0,0,0],note:""},done=g.goals.filter(Boolean).length,rec=Object.entries(S.gaming).sort().slice(-7);
 const m=done>=5?"🌟 All goals done — fantastic balance today!":done>=3?"💪 Great progress! You’re building healthy habits.":done>=1?"👍 Good start — every goal counts.":"Pick one small goal to begin. No pressure.";
 return `<h1>Control Your Gaming</h1><div class="msg">${esc(MSG[(NOW().getDate())%7])}</div><div class="card" style="margin-top:14px"><h2>Today’s goals (${done}/5)</h2><div class="bar"><i style="width:${done*20}%"></i></div>${ACT.map((a,i)=>`<label class="chk"><input type="checkbox" ${g.goals[i]?"checked":""} onchange="gSet('goals',${i},this.checked)">${a}</label>`).join("")}<div class="msg">${m}</div></div>
 <div class="card"><h2>Gaming-time reflection</h2><label class="mu">Minutes spent gaming today</label><input type="number" min="0" max="1440" id="gm" value="${g.min}"><label class="mu">How did it feel? What worked?</label><textarea id="gn" rows="3">${esc(g.note)}</textarea><br><br><button onclick="gRef()">Save reflection</button><div id="gs" class="mu" style="margin-top:8px"></div></div>
 <div class="card"><h2>Last 7 logged days</h2>${rec.map(([k,x])=>`<div class="row"><span>${k}</span><span>${x.min||0} min · ${(x.goals||[]).filter(Boolean).length}/5 goals</span></div>`).join("")||'<div class="mu">Log a day to see your trend.</div>'}</div>
 <div class="card"><h2>Tips for balance</h2>${TIPS.map(t=>`<div class="row">• ${t}</div>`).join("")}<p class="mu">Gaming isn’t bad — the aim is a balance you feel good about. Gradual change wins.</p></div>`}
function gEnsure(){const d=dk(NOW());return S.gaming[d]=S.gaming[d]||{min:0,goals:[0,0,0,0,0],note:""}}
function gSet(f,i,v){const g=gEnsure();g.goals[i]=v?1:0;save();render()}
function gRef(){const g=gEnsure();g.min=Math.max(0,+$("#gm").value||0);g.note=$("#gn").value.slice(0,500);save();$("#gs").textContent="✅ Saved. Thanks for reflecting — that’s a real step forward."}
function prof(){const st=stats();return `<h1>Profile</h1><div class="card" style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">${S.pic?`<img class="av" src="${S.pic}">`:`<div class="av">${esc(S.name[0]||"?").toUpperCase()}</div>`}<div style="flex:1;min-width:180px"><label class="mu">Name</label><input type="text" id="pn" value="${esc(S.name)}" maxlength="40" onchange="S.name=this.value.trim()||'Friend';save()"><div class="mu" style="margin-top:6px">${esc(me.email||"Signed in with your Claude account")}</div><br><input type="file" id="pf" accept="image/*" hidden onchange="pic(this.files[0])"><button class="sec" onclick="$('#pf').click()">Change picture</button></div></div>
 <div class="grid"><div class="card"><div class="mu">Total points</div><div class="big">${pts()}</div></div><div class="card"><div class="mu">Tests completed</div><div class="big">${st.n}</div></div><div class="card"><div class="mu">Weekly progress</div><div class="big">${st.imp>0?"+":""}${st.imp}</div></div></div>
 <div class="card"><div class="row"><span>Account created</span><b>${fd(S.created)}</b></div><div class="row"><span>Theme</span><span><button class="sec" onclick="theme('light')">Light</button> <button class="sec" onclick="theme('dark')">Dark</button></span></div></div><button onclick="logout()">Log out</button>`}
function theme(t){S.theme=t;document.documentElement.dataset.theme=t;save()}
function pic(f){if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement("canvas");c.width=c.height=128;const x=c.getContext("2d"),s=Math.min(im.width,im.height);x.drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,128,128);S.pic=c.toDataURL("image/jpeg",.8);save();render()};im.src=r.result};r.readAsDataURL(f)}
init();
</script></body></html>
